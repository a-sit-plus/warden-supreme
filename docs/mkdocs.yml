site_name: Warden Supreme
site_url: https://a-sit-plus.github.io/warden-supreme/

theme:
  name: material
  logo: assets/images/icon.svg
  favicon: assets/images/icon.svg
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.annotate
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github

  palette:
    - scheme: asp-dark
      font:
        text: Roboto


extra_css:
  - stylesheets/extra.css

repo_url: https://github.com/a-sit-plus/warden-supreme
repo_name: a-sit-plus/warden-supreme

copyright: Copyright &copy; 2025-2026 A-SIT Plus GmbH &bull; <a href="https://plus.a-sit.at/imprint.html" target="_blank">Imprint</a>

plugins:
  - social
  - search
  - macros
  - open-in-new-tab


name: Test Supreme Integration
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile
        run: ./gradlew :supreme-client:pixelAVDSetup :supreme-verifier:jvmTestClasses
      - name: Start Verifier
        run: ./gradlew :supreme-verifier:jvmTest &
      - name: Start Client Check
        run: ./gradlew pixelAVDAndroidDeviceTest --info
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Warden Supreme Android Device Tests
          path: supreme/client/build/outputs/androidTest-results/managedDevice/**/pixelAVD/TEST*.xml,supreme/**/build/test-results/**/TEST*.xml
          list-suites: failed
          list-tests: failed
          reporter: java-junit
          use-actions-summary: true

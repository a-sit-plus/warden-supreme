name: Test Supreme Integration
on: [push]
permissions:
  contents: read
  packages: read
  checks: write
jobs:
  test-private:
    name: test
    if: ${{ github.event.repository.private }}
    runs-on: [self-hosted, linux]
    container:
      image: ghcr.io/a-sit-plus/docker-android-sdk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps: &test-steps
      - name: Trust workspace repositories
        if: ${{ github.event.repository.private }}
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/warden-roboto"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/dependencies/keyattestation"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/dependencies/android-key-attestation"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/dependencies/http-proxy"
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: install sdk 30
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install  platform-tools "platforms;android-30" "build-tools;30.0.0" "system-images;android-30;default;x86_64"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile
        run: ./gradlew :supreme-client:createAndroidDeviceTestApkListingFileRedirect :supreme-verifier:jvmTestClasses
      - name: Start Verifier
        run: SUPREME_ENDTOENDTEST=true TESTBALLOON_INCLUDE_PATTERNS=at.asitplus.attestation.supreme.TestEnv* ./gradlew :supreme-verifier:jvmTest &
      - name: Start Client Check
        run: ./gradlew pixelAVDAndroidDeviceTest --info
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Warden Supreme Android Device Tests
          path: supreme/client/build/outputs/androidTest-results/managedDevice/**/pixelAVD/TEST*.xml,supreme/**/build/test-results/**/TEST*.xml
          reporter: java-junit
          use-actions-summary: true
  test-public:
    name: test
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps: *test-steps

name: Test and Build
on: [push]
permissions:
  contents: read
  packages: read
  checks: write
jobs:
  build:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    env:
      NO_PRIVATE_TEST_DATA: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build artefacts + Run Tests
        run: TESTBALLOON_EXCLUDE_PATTERNS=at.asitplus.attestation.supreme.TestEnv* ./gradlew allTests assemble
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: All Tests
          path: serverside/**/build/test-results/**/TEST*.xml,utils/**/build/test-results/**/TEST*.xml,supreme/**/build/test-results/**/TEST*.xml
          reporter: java-junit
  loader-mutation-private:
    name: loader-mutation
    if: ${{ github.event.repository.private }}
    runs-on: [self-hosted, linux]
    container:
      image: ghcr.io/a-sit-plus/docker-android-sdk:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: build
    env:
      NO_PRIVATE_TEST_DATA: "true"
    steps: &loader-mutation-steps
      - name: Trust workspace repositories
        if: ${{ github.event.repository.private }}
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/warden-roboto"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/dependencies/keyattestation"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/dependencies/android-key-attestation"
          git config --system --add safe.directory "$GITHUB_WORKSPACE/dependencies/http-proxy"
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run Loader Mutation Gate
        run: ./gradlew loaderMutationTest
      - name: Upload PIT Reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: loader-mutation-reports
          path: supreme/**/build/reports/pitest/**
  loader-mutation-public:
    name: loader-mutation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    needs: build
    env:
      NO_PRIVATE_TEST_DATA: "true"
    steps: *loader-mutation-steps

name: Test and Build
on: [push]
jobs:
  build:
    runs-on: macos-latest
    env:
      NO_PRIVATE_TEST_DATA: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install sbombastic to Maven Local
        run: |
          git clone --depth 1 https://github.com/a-sit-plus/sbombastic /tmp/sbombastic
          cd /tmp/sbombastic
          ./gradlew publishToMavenLocal
      - name: Build artefacts + Run Tests
        run: TESTBALLOON_EXCLUDE_PATTERNS=at.asitplus.attestation.supreme.TestEnv* ./gradlew allTests assemble
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: All Tests
          path: serverside/**/build/test-results/**/TEST*.xml,utils/**/build/test-results/**/TEST*.xml,supreme/**/build/test-results/**/TEST*.xml
          reporter: java-junit

name: Publish Dry Run
on:
  workflow_dispatch:
    inputs:
      kotlin-version:
        description: 'Override Kotlin version?'
        required: false
        default: ''
        type: string
      kotest-version:
        description: 'Override Kotest version?'
        required: false
        default: ''
        type: string
      ksp-version:
        description: 'Override KSP version? (full version string)?'
        required: false
        default: ''
        type: string
      docs_version:
        description: 'Documentation version to validate (for example, 2.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    env:
      KOTLIN_VERSION_ENV: ${{ inputs.kotlin-version }}
      KOTEST_VERSION_ENV: ${{ inputs.kotest-version }}
      KSP_VERSION_ENV: ${{ inputs.ksp-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.3.0
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Install deps
        run: brew install cairo freetype libffi libjpeg libpng zlib
      - name: Publish to project-local repo
        run: ./gradlew clean publishReleaseModulesToLocalRepository
        env:
          SIGN_LOCAL_REPO_ARTEFACTS: 'true'
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.PUBLISH_SIGNING_KEYID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PUBLISH_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PUBLISH_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.PUBLISH_SONATYPE_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.PUBLISH_SONATYPE_PASSWORD }}

      - name: List published Maven-local artifacts
        if: success() || failure()        # always run so the table appears even if publish failed
        shell: bash
        run: |
          ART_DIR="./repo/at/asitplus/warden"
          ls -la $ART_DIR
          # Header
          {
            echo "### Maven-local artifacts for \`at.asitplus.warden\`"
            echo ""
            echo "| Module | Version | File |"
            echo "|--------|---------|------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Abort early if nothing was written
          [[ -d "$ART_DIR" ]] || { echo "| _No artifacts found_ |  |  |" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          # Collect artifacts (jar / klib / aar / pom) and append table rows
          find "$ART_DIR" -type f \( -name "*.jar" -o -name "*.klib" -o -name "*.aar" -o -name "*.pom" -o -name "*.json" -o -name "*.xml" -o -name "*.asc" \) \
            | sort \
            | while read -r file; do
                rel="${file#${ART_DIR}/}"        # => module/version/filename
                IFS='/' read -r module version filename <<< "$rel"
                echo "| \`$module\` | \`$version\` | \`$filename\` |" >> "$GITHUB_STEP_SUMMARY"
              done

  deploy-docs:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}
    env:
      KOTLIN_VERSION_ENV: ${{ inputs.kotlin-version }}
      KOTEST_VERSION_ENV: ${{ inputs.kotest-version }}
      KSP_VERSION_ENV: ${{ inputs.ksp-version }}
      SIGN_LOCAL_REPO_ARTEFACTS: 'true'
      ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.PUBLISH_SIGNING_KEYID }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.PUBLISH_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.PUBLISH_SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Bootstrap sbombastic from main
        run: |
          git clone --depth 1 --branch main https://github.com/a-sit-plus/sbombastic.git /tmp/sbombastic
          /tmp/sbombastic/gradlew -p /tmp/sbombastic publishToMavenLocal
      - run: pip install mkdocs-material==9.5.40
      - run: pip install mkdocs-material[imaging]==9.5.40
      - run: pip install mkdocs-macros-plugin==1.3.7
      - run: pip install mkdocs-open-in-new-tab
      - run: pip install mike
      - name: Build versioned documentation without publishing
        run: |
          export DYLD_FALLBACK_LIBRARY_PATH=/opt/homebrew/lib
          ./gradlew mkDocsSite && cd docs && mike deploy --update-aliases "${{ inputs.docs_version }}" latest
